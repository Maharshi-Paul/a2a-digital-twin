version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: wdt_postgres
    environment:
      POSTGRES_USER: wdt_user
      POSTGRES_PASSWORD: wdt_pass
      POSTGRES_DB: warehouse_twin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wdt_user -d warehouse_twin"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wdt_redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
