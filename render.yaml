services:
  - type: web
    name: a2a-warehouse-twin-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: QUEUE_TICK_SECONDS
        value: "10.0"
      - key: QUEUE_ENGINE_IDLE_WHEN_EMPTY
        value: "true"
      - key: LLM_PROVIDER
        value: "none"
